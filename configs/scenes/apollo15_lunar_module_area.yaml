# Scene around the Apollo 15 lunar module (site apollo15_landing_site).
scene_seed: 7
profile: {site: apollo15_landing_site, rover: skid_steer_four_wheel}
terrain:
  backdrop: {enabled: true, size_m: 102400.0, spacing_m: 128.0}   # SLDEM2015 (site dem_backdrop_path): relief out to
                                          # 51 km (the camera's own horizon is ~1.6 km away at 0.75 m height)
spawn:
  search_radius_m: 8.0                    # seeds 7-10 leave no safe spawn within 4 m of the centre (rocks, crater rims)
