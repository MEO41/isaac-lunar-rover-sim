# Ina irregular mare patch, Lacus Felicitatis (young volcanic mounds and hummocky floor).
# DTM: LROC NAC DTM INACALDERA (5 m/post, equirectangular, standard parallel 19.0 deg from the PDS label),
# PDS LROLRC_2001 DATA/SDP/NAC_DTM/INACALDERA/ (pds.mcp.nasa.gov image archive; pds.lroc.im-ldi.com redirects there).
# Origin: the flat patch closest to Ina at 5.30 E, 18.65 N (target box: mean 14.51, max 36.16 deg: the mounds themselves)
# (ASSUMPTION: published position, approximate to a few metres), found with scripts/find_flat_site_origin.py:
# 38.1 m from the target, 40 m box mean / max slope 3.37 / 7.05 deg, regional-tier DTM coverage 1.000.
# The same DTM is used as fine and coarse source. Cut-off wavelength = 4 posts.
site:
  name: ina_caldera_site
  dem_fine_path: ${NAC_DEM_DIRECTORY}/NAC_DTM_INACALDERA.TIF
  dem_coarse_path: ${NAC_DEM_DIRECTORY}/NAC_DTM_INACALDERA.TIF
  origin_longitude_deg: 5.29868
  origin_latitude_deg: 18.6499
  standard_parallel_deg: 19.0
  dem_cutoff_wavelength_m: 20.0
terrain:
  fractal:                                # the DTM does not resolve 4 m: measure the anchor at 2 posts, as the 2 m DTMs
    structure_function_anchor_lag_m: 10.0
    structure_function_anchor_valid_range_m: [0.228, 1.254]   # [0.10, 0.55] x (10 / 4)^0.9; upper bound 0.55: the
    # Ina mound field is rougher than the default range (measured 1.173 m at 10 m = 0.514 m at 4 m, 2026-11-17)
