# Surveyor 7 landing site, Tycho ejecta blanket north of the rim (rough highland).
# DTM: LROC NAC DTM SURVEYOR7 (2 m/post, equirectangular, standard parallel -41.0 deg from the PDS label),
# PDS LROLRC_2001 DATA/SDP/NAC_DTM/SURVEYOR7/ (pds.mcp.nasa.gov image archive; pds.lroc.im-ldi.com redirects there).
# Origin: the flat patch closest to Surveyor 7 at 11.4387 W, 40.9813 S (ASSUMPTION: published position, approximate
# to a few metres) whose bake crop fits inside the DTM (the lander is ~0.5 km from the DTM's east edge), found with
# scripts/find_flat_site_origin.py: 589 m west-northwest of the lander, still on the Tycho ejecta blanket; 40 m box
# mean / max slope 3.49 / 7.86 deg, regional-tier DTM coverage 0.954.
# The same DTM is used as fine and coarse source. Cut-off wavelength = 4 posts.
site:
  name: surveyor7_site
  dem_fine_path: ${NAC_DEM_DIRECTORY}/NAC_DTM_SURVEYOR7.TIF
  dem_coarse_path: ${NAC_DEM_DIRECTORY}/NAC_DTM_SURVEYOR7.TIF
  origin_longitude_deg: -11.46373
  origin_latitude_deg: -40.97677
  standard_parallel_deg: -41.0
  dem_cutoff_wavelength_m: 8.0
