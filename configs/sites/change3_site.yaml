# Chang'e 3 landing site, northern Mare Imbrium (young mare; Yutu rover).
# DTM: LROC NAC DTM CHANGE3 (5 m/post, equirectangular, standard parallel 44.0 deg from the PDS label),
# PDS LROLRC_2001 DATA/SDP/NAC_DTM/CHANGE3/ (pds.mcp.nasa.gov image archive; pds.lroc.im-ldi.com redirects there).
# Origin: the flat patch closest to Chang'e 3 lander at 19.5116 W, 44.1214 N
# (ASSUMPTION: published position, approximate to a few metres), found with scripts/find_flat_site_origin.py:
# 2.6 m from the target, 40 m box mean / max slope 2.41 / 4.71 deg, regional-tier DTM coverage 1.000.
# The same DTM is used as fine and coarse source. Cut-off wavelength = 4 posts.
site:
  name: change3_site
  dem_fine_path: ${NAC_DEM_DIRECTORY}/NAC_DTM_CHANGE3.TIF
  dem_coarse_path: ${NAC_DEM_DIRECTORY}/NAC_DTM_CHANGE3.TIF
  origin_longitude_deg: -19.5115
  origin_latitude_deg: 44.12136
  standard_parallel_deg: 44.0
  dem_cutoff_wavelength_m: 20.0
terrain:
  fractal:                                # the DTM does not resolve 4 m: measure the anchor at 2 posts, as the 2 m DTMs
    structure_function_anchor_lag_m: 10.0
    structure_function_anchor_valid_range_m: [0.228, 0.912]   # [0.10, 0.40] x (10 / 4)^0.9
