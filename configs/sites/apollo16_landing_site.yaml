# Apollo 16 landing site, Descartes highlands (rough highland terrain). Origin near the lunar module.
# DTM: LROC NAC DTM APOLLO16 (2 m/post, equirectangular, standard parallel -9.0 deg from the PDS label),
# https://pds.lroc.im-ldi.com/data/LRO-L-LROC-5-RDR-V1.0/LROLRC_2001/DATA/SDP/NAC_DTM/APOLLO16/
# Origin: lunar module position (LROC-derived, rounded to 1e-5 deg; ASSUMPTION: approximate to a few metres).
# The same DTM is used as fine and coarse source (no separate mosaic exists for this site).
site:
  name: apollo16_landing_site
  dem_fine_path: ${NAC_DEM_DIRECTORY}/NAC_DTM_APOLLO16.TIF
  dem_coarse_path: ${NAC_DEM_DIRECTORY}/NAC_DTM_APOLLO16.TIF
  origin_longitude_deg: 15.50019
  origin_latitude_deg: -8.97301
  standard_parallel_deg: -9.0
